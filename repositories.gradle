
repositories {
    maven {
        // RetroFuturaBootstrap
        name "GTNH Maven"
        url "https://nexus.gtnewhorizons.com/repository/public/"
        content {
            includeGroup("com.gtnewhorizons.retrofuturabootstrap")
        }
    }
    ivy {
        name "LiteLoader"
        artifactPattern "https://dl.liteloader.com/versions/com/mumfrey/[module]/1.7.10/[module]-[revision](-[classifier]).[ext]"
        metadataSources {
            artifact()
        }
        content {
            includeGroup("com.mumfrey")
        }
    }
}
