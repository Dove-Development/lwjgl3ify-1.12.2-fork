name: Release

# Two ways to release:
#  - Actions > Release > Run workflow: bumps modVersion in gradle.properties (or keeps it), commits,
#    tags the commit with the version and publishes the release.
#  - Pushing a tag yourself: releases that tag as the version.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (current = release the version gradle.properties already has)'
        type: choice
        options: [ patch, minor, major, current ]
        default: patch
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true
  push:
    tags: [ '*' ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${{ inputs.bump }}" == "current" ]]; then
            VERSION="$(python3 tools/bump-version.py current)"
          else
            VERSION="$(python3 tools/bump-version.py "${{ inputs.bump }}")"
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists; bump the version instead"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet gradle.properties; then
            git commit -m "Release ${VERSION}" gradle.properties
          fi
          git tag "${VERSION}"
          git push origin HEAD "refs/tags/${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${{ inputs.prerelease }}" >> "$GITHUB_ENV"

      - name: Version from tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_NAME}" == 0.* || "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 8, 17 and 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          # 17 runs Gradle/RetroFuturaGradle and compiles the mod (Jabel), 8 and 21 are its toolchains
          java-version: |
            8
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --stacktrace -PmodVersion="${VERSION}" assemble

      - name: Checksums
        shell: bash
        run: |
          mkdir -p release
          cp "build/libs/lwjgl3ify-${VERSION}.jar" "build/libs/lwjgl3ify-${VERSION}-forgePatches.jar" \
            build/libs/version.json build/distributions/*.zip release/
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete --yes "${VERSION}" 2>/dev/null || true
          FLAGS=""
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS="--prerelease"
          fi
          gh release create "${VERSION}" --title "lwjgl3ify for 1.12.2 ${VERSION}" --generate-notes ${FLAGS} release/*

      # The launcher downloads lwjgl3ify from Cloudflare R2 (downloads.doveclient.com), not GitHub. R2
      # keeps only the newest release: its files go under lwjgl3ify/1.12.2/<version>/, then
      # lwjgl3ify/1.12.2/latest.json names it, and every older version's folder is deleted.
      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 cp release/ "s3://dove-releases/lwjgl3ify/1.12.2/${VERSION}/" --recursive --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=31536000, immutable" --no-progress
          jq -n --arg version "$VERSION" --argjson prerelease "$PRERELEASE" '{version: $version, prerelease: $prerelease}' > latest.json
          aws s3 cp latest.json "s3://dove-releases/lwjgl3ify/1.12.2/latest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-cache --no-progress
          aws s3 rm "s3://dove-releases/lwjgl3ify/1.12.2/" --recursive --exclude "${VERSION}/*" --exclude latest.json --endpoint-url "$R2_ENDPOINT"
